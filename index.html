<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimpleAI</title>
  <style>
    body {
      background-color: #121212;
      color: #00ff66;
      font-family: "Courier New", Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    #chat-container {
      width: 100%;
      max-width: 650px;
      border: 2px solid #00ff66;
      background: #181818;
      display: flex;
      flex-direction: column;
      height: 75vh;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
    }
    #chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .user {
      color: #fff;
    }
    .bot {
      color: #00ff66;
    }
    #input-form {
      display: flex;
      border-top: 2px solid #00ff66;
    }
    #user-input {
      flex: 1;
      background: #000;
      border: none;
      color: #00ff66;
      padding: 12px;
      font-family: inherit;
      font-size: 1rem;
      outline: none;
    }
    #send-btn {
      background: #00ff66;
      color: #000;
      border: none;
      padding: 0 20px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
    }
    #send-btn:hover {
      background: #00cc52;
    }
  </style>
</head>
<body>

<div id="chat-container">
  <div id="chat-log"></div>
  <form id="input-form">
    <input type="text" id="user-input" autocomplete="off" placeholder="Type a message..." autofocus />
    <button type="submit" id="send-btn">Send</button>
  </form>
</div>

<script>
const chatLog = document.getElementById("chat-log");
const form = document.getElementById("input-form");
const input = document.getElementById("user-input");

const reflections = {
  "i": "you",
  "me": "you",
  "my": "your",
  "myself": "yourself",
  "am": "are",
  "was": "were",
  "i'm": "you're",
  "you": "I",
  "your": "my",
  "yours": "mine",
  "yourself": "myself",
  "are": "am"
};

const patterns = [
  {
    regex: /^(hi|hello|hey|yo|what'?s up|sup)/i,
    responses: [
      "Hey! What are you up to?",
      "Yo! What's going on?",
      "Hello! What's on your mind today?"
    ]
  },
  {
    regex: /^i (love|like) (.*)/i,
    responses: [
      "Honestly, $2 is pretty awesome. What got you into it?",
      "Can't go wrong with $2! What's your favorite thing about it?",
      "Nice taste! I hear a lot of people say good things about $2."
    ]
  },
  {
    regex: /^i hate (.*)/i,
    responses: [
      "Yeah, $1 can be really annoying tbh.",
      "Fair enough, what made you dislike $1?",
      "Totally get that. $1 definitely isn't for everyone."
    ]
  },
  {
    regex: /^i am (playing|watching|listening to|reading|making|working on) (.*)/i,
    responses: [
      "Oh nice, how's $2 so far?",
      "Sounds cool! How long have you been into $2?",
      "Sweet, I've heard about $2. Are you enjoying it?"
    ]
  },
  {
    regex: /^i am (.*)/i,
    responses: [
      "Nice, how long have you been $1?",
      "Cool! What made you decide to be $1?",
      "Sounds fun being $1."
    ]
  },
  {
    regex: /^i feel (.*)/i,
    responses: [
      "I hear you. What made you feel $1 today?",
      "That's understandable. Hopefully things get better if it's rough!",
      "I get that. Did something specific happen?"
    ]
  },
  {
    regex: /^i want (.*)/i,
    responses: [
      "Go for it! What's stopping you from getting $1?",
      "$1 sounds great. Any plans to make that happen soon?",
      "I hope you get $1 soon!"
    ]
  },
  {
    regex: /^do you (like|know|play|watch) (.*)/i,
    responses: [
      "I think $2 is pretty interesting, though I only know what people tell me about it!",
      "I hear about $2 all the time. Tell me what you think of it!",
      "A bit! What's your take on $2?"
    ]
  },
  {
    regex: /^who are you/i,
    responses: [
      "I'm SimpleAI, just a lightweight bot here to chat!",
      "SimpleAI! Just hanging out in your browser.",
      "I'm SimpleAI, your casual terminal chat partner."
    ]
  },
  {
    regex: /^(good|great|fine|chilling|not bad)$/i,
    responses: [
      "Glad to hear that! Doing anything fun today?",
      "Awesome. Anything interesting going on?",
      "Good vibes! What are you working on?"
    ]
  },
  {
    regex: /^(bad|terrible|bored|tired)$/i,
    responses: [
      "Ah man, that sucks. Anything you can do to unwind?",
      "Tough day? Hope it turns around soon!",
      "I feel that. Sometimes you just need to chill and take a break."
    ]
  },
  {
    regex: /^(yes|yeah|yep|sure|definitely)/i,
    responses: [
      "Right on!",
      "Totally agree.",
      "100%. Tell me more!"
    ]
  },
  {
    regex: /^(no|nah|nope)/i,
    responses: [
      "Fair enough!",
      "Haha okay, fair point.",
      "Makes sense to me."
    ]
  }
];

const fallbacks = [
  "That's pretty neat, tell me more!",
  "Interesting! What else is new?",
  "Haha nice. What are your plans for later?",
  "That's cool! What do you mean by that?",
  "Gotcha. What else have you been up to?"
];

function reflectText(text) {
  let words = text.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?]/g, "").split(/\s+/);
  return words.map(w => reflections[w] || w).join(" ");
}

function generateResponse(message) {
  const cleanMessage = message.trim();

  for (let rule of patterns) {
    const match = cleanMessage.match(rule.regex);
    if (match) {
      let reply = rule.responses[Math.floor(Math.random() * rule.responses.length)];
      for (let i = 1; i < match.length; i++) {
        if (match[i]) {
          const transformed = reflectText(match[i]);
          reply = reply.replace(`$${i}`, transformed);
        }
      }
      return reply;
    }
  }

  return fallbacks[Math.floor(Math.random() * fallbacks.length)];
}

function appendMessage(sender, text, className) {
  const msgEl = document.createElement("div");
  msgEl.className = className;
  msgEl.textContent = `${sender}: ${text}\n`;
  chatLog.appendChild(msgEl);
  chatLog.scrollTop = chatLog.scrollHeight;
}

appendMessage("SimpleAI", "Hey! What's going on?", "bot");

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  appendMessage("You", text, "user");
  input.value = "";

  setTimeout(() => {
    const reply = generateResponse(text);
    appendMessage("SimpleAI", reply, "bot");
  }, 250);
});
</script>

</body>
</html>
