<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimpleAI</title>
  <style>
    body {
      background-color: #121212;
      color: #00ff66;
      font-family: "Courier New", Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    #chat-container {
      width: 100%;
      max-width: 650px;
      border: 2px solid #00ff66;
      background: #181818;
      display: flex;
      flex-direction: column;
      height: 75vh;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
    }
    #chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .user {
      color: #fff;
    }
    .bot {
      color: #00ff66;
    }
    #input-form {
      display: flex;
      border-top: 2px solid #00ff66;
    }
    #user-input {
      flex: 1;
      background: #000;
      border: none;
      color: #00ff66;
      padding: 12px;
      font-family: inherit;
      font-size: 1rem;
      outline: none;
    }
    #send-btn {
      background: #00ff66;
      color: #000;
      border: none;
      padding: 0 20px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
    }
    #send-btn:hover {
      background: #00cc52;
    }
  </style>
</head>
<body>

<div id="chat-container">
  <div id="chat-log"></div>
  <form id="input-form">
    <input type="text" id="user-input" autocomplete="off" placeholder="Type your thoughts..." autofocus />
    <button type="submit" id="send-btn">Send</button>
  </form>
</div>

<script>
const chatLog = document.getElementById("chat-log");
const form = document.getElementById("input-form");
const input = document.getElementById("user-input");

const reflections = {
  "i am": "you are",
  "i was": "you were",
  "i": "you",
  "me": "you",
  "my": "your",
  "myself": "yourself",
  "you are": "I am",
  "you were": "I was",
  "you": "me",
  "your": "my",
  "yours": "mine",
  "yourself": "myself",
  "am": "are"
};

const patterns = [
  {
    regex: /^(hello|hi|hey|howdy)(.*)/i,
    responses: [
      "Hello. What is on your mind today?",
      "Hi there. How are you feeling right now?",
      "Greetings. What brings you here?"
    ]
  },
  {
    regex: /^i (love|like) (.*)/i,
    responses: [
      "Why do you $1 $2?",
      "What makes you $1 $2 so much?",
      "Does loving $2 bring you comfort?"
    ]
  },
  {
    regex: /^i feel (.*)/i,
    responses: [
      "Tell me more about feeling $1.",
      "Do you often feel $1?",
      "Does feeling $1 bother you?"
    ]
  },
  {
    regex: /^i need (.*)/i,
    responses: [
      "Why do you need $1?",
      "Would getting $1 really help you?",
      "What if you never get $1?"
    ]
  },
  {
    regex: /^i want (.*)/i,
    responses: [
      "What would it mean to you if you got $1?",
      "Why do you want $1?",
      "Suppose you got $1 soon, what next?"
    ]
  },
  {
    regex: /^i am (.*)/i,
    responses: [
      "How long have you been $1?",
      "Do you believe it is normal to be $1?",
      "Did you come to me because you are $1?"
    ]
  },
  {
    regex: /^i (can't|cannot) (.*)/i,
    responses: [
      "How do you know you can't $2?",
      "Have you tried to $2?",
      "Perhaps you could $2 if you really wanted to."
    ]
  },
  {
    regex: /^i don't (.*)/i,
    responses: [
      "Don't you really $1?",
      "Why don't you $1?",
      "Does it trouble you that you don't $1?"
    ]
  },
  {
    regex: /(.*) (mother|father|mom|dad|family|brother|sister)(.*)/i,
    responses: [
      "Tell me more about your family.",
      "How does that relate to your parents?",
      "Did your family influence those thoughts?"
    ]
  },
  {
    regex: /^(yes|yeah|sure|yep)/i,
    responses: [
      "You seem quite positive.",
      "Are you sure?",
      "I understand. Go on."
    ]
  },
  {
    regex: /^(no|nope|nah)/i,
    responses: [
      "Why not?",
      "You sound a bit negative.",
      "Are you saying that just to disagree?"
    ]
  },
  {
    regex: /^(good|great|fine|bad|terrible|okay|ok)$/i,
    responses: [
      "Why do you feel that way?",
      "What makes things that way for you?",
      "Can you explain why it is like that?"
    ]
  },
  {
    regex: /^because (.*)/i,
    responses: [
      "Is that the real reason?",
      "What other reasons might there be?",
      "Does that reason explain anything else?"
    ]
  }
];

const fallbacks = [
  "Please, go on.",
  "What does that suggest to you?",
  "Can you elaborate on that?",
  "I'm not sure I understand you fully.",
  "How does that make you feel?"
];

function reflectText(text) {
  let words = text.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?]/g, "").split(/\s+/);
  return words.map(w => reflections[w] || w).join(" ");
}

function generateResponse(message) {
  const cleanMessage = message.trim();

  for (let rule of patterns) {
    const match = cleanMessage.match(rule.regex);
    if (match) {
      let reply = rule.responses[Math.floor(Math.random() * rule.responses.length)];
      
      for (let i = 1; i < match.length; i++) {
        if (match[i]) {
          const transformed = reflectText(match[i]);
          reply = reply.replace(`$${i}`, transformed);
        }
      }
      return reply;
    }
  }

  return fallbacks[Math.floor(Math.random() * fallbacks.length)];
}

function appendMessage(sender, text, className) {
  const msgEl = document.createElement("div");
  msgEl.className = className;
  msgEl.textContent = `${sender}: ${text}\n`;
  chatLog.appendChild(msgEl);
  chatLog.scrollTop = chatLog.scrollHeight;
}

appendMessage("SimpleAI", "How do you do. Please tell me what is troubling you.", "bot");

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  appendMessage("You", text, "user");
  input.value = "";

  setTimeout(() => {
    const reply = generateResponse(text);
    appendMessage("SimpleAI", reply, "bot");
  }, 300);
});
</script>

</body>
</html>
