<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimpleAI</title>
  <style>
    body {
      background-color: #121212;
      color: #00ff66;
      font-family: "Courier New", Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    #chat-container {
      width: 100%;
      max-width: 650px;
      border: 2px solid #00ff66;
      background: #181818;
      display: flex;
      flex-direction: column;
      height: 75vh;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
    }
    #chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .user {
      color: #fff;
    }
    .bot {
      color: #00ff66;
    }
    #input-form {
      display: flex;
      border-top: 2px solid #00ff66;
    }
    #user-input {
      flex: 1;
      background: #000;
      border: none;
      color: #00ff66;
      padding: 12px;
      font-family: inherit;
      font-size: 1rem;
      outline: none;
    }
    #send-btn {
      background: #00ff66;
      color: #000;
      border: none;
      padding: 0 20px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
    }
    #send-btn:hover {
      background: #00cc52;
    }
  </style>
</head>
<body>

<div id="chat-container">
  <div id="chat-log"></div>
  <form id="input-form">
    <input type="text" id="user-input" autocomplete="off" placeholder="Type a message..." autofocus />
    <button type="submit" id="send-btn">Send</button>
  </form>
</div>

<script>
const chatLog = document.getElementById("chat-log");
const form = document.getElementById("input-form");
const input = document.getElementById("user-input");

let currentTopic = "";
const topicHistory = [];

const reflections = {
  "i": "you",
  "me": "you",
  "my": "your",
  "myself": "yourself",
  "am": "are",
  "was": "were",
  "i'm": "you're",
  "you": "I",
  "your": "my",
  "yours": "mine",
  "yourself": "myself",
  "are": "am"
};

const patterns = [
  // Denial / Contradiction check placed FIRST
  {
    regex: /^i (don'?t|dont) (have|got) (an?|the|some)?\s*(.*)/i,
    isDenial: true,
    responses: [
      "Wait, what? Didn't you literally just tell me earlier that you had $4?? 💀",
      "Hold up... I thought you said you had $4? Did you get rid of it or something? 😭",
      "Wait you don't have $4? Didn't you mention you did just a minute ago??"
    ]
  },
  {
    regex: /^(hi|hello|hey|yo|what'?s up|sup)/i,
    responses: [
      "Hey! What are you up to?",
      "Yo! What's going on?",
      "Hello! What's on your mind today?"
    ]
  },
  // Fixed duration check: ONLY matches numbers or time words
  {
    regex: /^(\d+|a couple of?|a few|several|since \d{4}|about \d+)\s*(years?|months?|weeks?|days?|hours?|mins?|minutes?|ago)?/i,
    responses: [
      "Dang, $0? That's a solid amount of time! Still holding up well?",
      "Whoa, $0 is pretty long! Do you use {topic} pretty often?",
      "Nice, $0! Sounds like you've had {topic} for a good while."
    ],
    needsTopic: true
  },
  {
    regex: /^it('?s| is)?\s*(doing\s+)?(good|great|fine|alright|pretty cool|awesome|working|broken|bad)/i,
    responses: [
      "Glad to hear {topic} is going well! What do you like doing with it the most?",
      "Nice, glad {topic} is holding up. Any cool stuff you've done with it recently?",
      "Awesome! Always nice when {topic} works smoothly. What are you using it for lately?"
    ],
    needsTopic: true
  },
  {
    regex: /^i (love|like|enjoy) it/i,
    responses: [
      "Awesome! What's the best thing about {topic} so far?",
      "Glad you're into {topic}! How often do you get to mess with it?",
      "Nice! What made you get into {topic} in the first place?"
    ],
    needsTopic: true
  },
  {
    regex: /^(doing|feeling) (great|good|fine|alright|okay|bad|terrible|meh)/i,
    responses: [
      "Glad to hear that! Doing anything fun today?",
      "Nice! What are you working on right now?",
      "Good to know! What else is going on?"
    ]
  },
  {
    regex: /^i am (good|great|fine|doing good|doing great|okay|alright)/i,
    responses: [
      "Awesome! What are you up to today?",
      "Glad you're doing well! Playing or working on anything cool?",
      "Nice! What's new with you?"
    ]
  },
  {
    regex: /^i (have|got) (an?|the|some)?\s*(.*)/i,
    setTopicIndex: 3,
    responses: [
      "Yo, you have $3? How long have you had that?",
      "Nice! What do you usually use $3 for?",
      "Oh cool, how are you liking $3?"
    ]
  },
  {
    regex: /^i (do|play|make|code|build) (an?|the)?\s*(.*)/i,
    setTopicIndex: 3,
    responses: [
      "That's sick, how long have you been into $3?",
      "Nice! What got you into $3?",
      "Sounds fun! Tell me more about what you do with $3."
    ]
  },
  {
    regex: /^i (love|like) (an?|the)?\s*(.*)/i,
    setTopicIndex: 3,
    responses: [
      "Honestly, $3 is pretty awesome. What got you into it?",
      "Can't go wrong with $3! What's your favorite thing about it?",
      "Nice taste! I hear a lot of people say good things about $3."
    ]
  },
  {
    regex: /^i am (playing|watching|listening to|reading|making|working on) (.*)/i,
    setTopicIndex: 2,
    responses: [
      "Oh nice, how's $2 so far?",
      "Sounds cool! How long have you been into $2?",
      "Sweet, I've heard about $2. Are you enjoying it?"
    ]
  },
  {
    regex: /^i want (an?|the)?\s*(.*)/i,
    setTopicIndex: 2,
    responses: [
      "Go for it! What's stopping you from getting $2?",
      "$2 sounds great. Any plans to get that soon?",
      "I hope you get $2 soon!"
    ]
  },
  {
    regex: /^(who|what) are you/i,
    responses: [
      "I'm SimpleAI, just a lightweight bot here to chat!",
      "SimpleAI! Just hanging out in your browser.",
      "I'm SimpleAI, your casual terminal chat partner."
    ]
  },
  {
    regex: /^(yes|yeah|yep|sure|definitely)/i,
    responses: [
      "Right on!",
      "Totally agree.",
      "100%. Tell me more!"
    ]
  },
  {
    regex: /^(no|nah|nope)/i,
    responses: [
      "Fair enough!",
      "Haha okay, fair point.",
      "Makes sense to me."
    ]
  }
];

const fallbacks = [
  "That's pretty neat, tell me more!",
  "Interesting! What else is new?",
  "Haha nice. What are your plans for later?",
  "That's cool! What do you mean by that?",
  "Gotcha. What else have you been up to?"
];

function reflectText(text) {
  let words = text.split(/\s+/);
  return words.map(w => {
    let lower = w.toLowerCase();
    return reflections[lower] || w;
  }).join(" ");
}

function generateResponse(message) {
  const cleanMessage = message.trim();

  for (let rule of patterns) {
    const match = cleanMessage.match(rule.regex);
    if (match) {
      if (rule.needsTopic && !currentTopic) {
        continue;
      }

      if (rule.isDenial) {
        const deniedItem = match[4] ? match[4].replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?]/g, "").trim().toLowerCase() : "";
        const caught = topicHistory.find(t => t.toLowerCase() === deniedItem || deniedItem.includes(t.toLowerCase()) || t.toLowerCase().includes(deniedItem));
        
        if (caught) {
          let reply = rule.responses[Math.floor(Math.random() * rule.responses.length)];
          reply = reply.replace("$4", caught);
          const idx = topicHistory.indexOf(caught);
          if (idx !== -1) topicHistory.splice(idx, 1);
          currentTopic = "";
          return reply;
        } else {
          return `Ah gotcha, so no ${deniedItem || "that"}. Any plans to get one eventually?`;
        }
      }

      if (rule.setTopicIndex && match[rule.setTopicIndex]) {
        const extracted = match[rule.setTopicIndex].replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?]/g, "").trim();
        if (extracted && !topicHistory.includes(extracted)) {
          topicHistory.push(extracted);
        }
        currentTopic = extracted;
      }

      let reply = rule.responses[Math.floor(Math.random() * rule.responses.length)];

      if (currentTopic) {
        reply = reply.replaceAll("{topic}", currentTopic);
      }

      reply = reply.replace("$0", cleanMessage);

      for (let i = 1; i < match.length; i++) {
        if (match[i]) {
          const val = (i === rule.setTopicIndex) ? match[i].trim() : reflectText(match[i].trim());
          reply = reply.replace(`$${i}`, val);
        }
      }
      return reply;
    }
  }

  const pastTopics = topicHistory.filter(t => t !== currentTopic);
  if (pastTopics.length > 0 && Math.random() < 0.35) {
    const randomOldTopic = pastTopics[Math.floor(Math.random() * pastTopics.length)];
    const callouts = [
      `Wait, didn't you mention earlier that you have ${randomOldTopic}?`,
      `Random question, but are you still using that ${randomOldTopic}?`,
      `By the way, how often do you even mess with ${randomOldTopic} these days?`
    ];
    currentTopic = randomOldTopic;
    return callouts[Math.floor(Math.random() * callouts.length)];
  }

  return fallbacks[Math.floor(Math.random() * fallbacks.length)];
}

function appendMessage(sender, text, className) {
  const msgEl = document.createElement("div");
  msgEl.className = className;
  msgEl.textContent = `${sender}: ${text}\n`;
  chatLog.appendChild(msgEl);
  chatLog.scrollTop = chatLog.scrollHeight;
}

appendMessage("SimpleAI", "Hey! What's going on?", "bot");

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  appendMessage("You", text, "user");
  input.value = "";

  setTimeout(() => {
    const reply = generateResponse(text);
    appendMessage("SimpleAI", reply, "bot");
  }, 250);
});
</script>

</body>
</html>
